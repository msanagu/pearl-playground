name: Deploy to GitHub Pages

# No VITE_ANTHROPIC_API_KEY here, deliberately — this is a client-only app
# and Vite bakes any VITE_* env var straight into the shipped JS bundle.
# Visitors bring their own key through the app's BYOK gate instead
# (see src/ApiKeyGate.tsx); nothing secret is ever built into this site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # `@msanagu/pearl` comes from GitHub Packages, whose npm registry requires
  # an auth token on every request — even for public packages. This grants
  # the run's built-in GITHUB_TOKEN read access to it.
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Written to the user-level ~/.npmrc, not the project's: pnpm refuses to
      # expand credentials from a project .npmrc (it's committed, so a token
      # there could leak to an attacker-controlled registry) and would ignore
      # the line entirely.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
